# Agentic DevOps — AWS deployment config (prod variant).
#
# Shipped to the host's /opt/devy/config/config.yaml by the `devy` deploy role
# (defaults: devy_config_file). This closes the "config axis parked" gap
# (deploy-design.md §13) — the deploy no longer ships config.example.yaml.
#
# SAFE TO COMMIT: this file carries NO secrets. Provider keys, MCP bearers, etc.
# resolve from AWS Secrets Manager via the host's instance IAM role at runtime
# (DEVY_MODE=prod is baked into docker-compose-aws.yml); this file only names them.

default_tier: balanced

database:
  url: ${DATABASE_URL}   # bundled compose Postgres (docker-compose-aws.yml) unless overridden

# Real AWS Secrets Manager (no LocalStack). DEVY_MODE=prod from the compose file
# wins regardless; stated here for clarity. boto3 uses the instance IAM role.
secrets:
  mode: prod
  region: us-east-1
  cache_ttl: 60
  audit_enabled: true

# Image attachments → content-addressed S3 blob store (real S3 in prod, via the
# instance IAM role — grant s3:{Get,Put,Head}Object on the bucket). The bucket name
# is account-specific, so it comes from ${DEVY_BLOBS_BUCKET} (rendered into the host
# .env from the BLOBS_BUCKET Actions variable) — never hardcoded in this public file.
# If BLOBS_BUCKET is unset for your deployment, drop `enabled` to false.
attachments:
  enabled: true
  bucket: ${DEVY_BLOBS_BUCKET}
  max_bytes: 5000000       # 5 MB per image
  max_per_turn: 6
  digest_enabled: true     # one-time vision description per unique image
  digest_tier: balanced    # sonnet-4-6 is vision-capable

# Tiers — the 4.x Anthropic family this deployment's key carries (the dev key has
# NO 3.5 access), each with cross-provider fallbacks (OpenAI → Gemini; keys in SM).
# Users pick a tier; the concrete model stays hidden. NO Ollama tier here — there is
# no Ollama server in AWS (the example's fast tier pointed at localhost:11434).
tiers:
  fast:
    model: anthropic/claude-haiku-4-5-20251001
    label: Fast
    max_tokens: 2048
    fallbacks:
      - { model: openai/gpt-5-mini, max_tokens: 4096 }
      - { model: gemini/gemini-flash-latest, max_tokens: 4096 }
  balanced:
    model: anthropic/claude-sonnet-4-6
    label: Balanced
    max_tokens: 4096
    fallbacks:
      - { model: openai/gpt-5-mini, max_tokens: 6144 }
      - { model: gemini/gemini-flash-latest, max_tokens: 6144 }
  deep:
    model: anthropic/claude-opus-4-8
    label: Deep
    max_tokens: 8192
    fallbacks:
      - { model: openai/gpt-5, max_tokens: 8192 }
      - { model: gemini/gemini-pro-latest, max_tokens: 8192 }

# Mount the containerized host MCP (host + docker diagnostics) on the compose network.
# It serves without a bearer on the internal net (no host port is published). The
# The `host` mount is the co-located NATIVE host-MCP sidecar — a hardened systemd unit
# on THIS EC2 host (deployed by host-mcp-deploy.yml), reached over the Docker host
# gateway. It sees the REAL host (journal/systemd/reboot), NOT a container namespace.
# The proxy forwards the vaulted devy/mcp/host bearer (secret_ref).
mcp_servers:
  - name: host
    transport: http
    url: http://host.docker.internal:8781/mcp
    secret_ref: devy/mcp/host
  # EDGE host-MCP sidecars — native systemd units on the edge fleet, deployed the same
  # way, reached across the subnet (the SG allows platform→edge:8781). URLs are
  # account-specific → rendered from the EDGE_*_MCP_URL Actions vars; an unset/empty var
  # is a best-effort "unreachable" mount that never blocks startup. Same bearer.
  - name: edge_al2023
    transport: http
    url: ${EDGE_AL2023_MCP_URL}
    secret_ref: devy/mcp/host
  - name: edge_ubuntu
    transport: http
    url: ${EDGE_UBUNTU_MCP_URL}
    secret_ref: devy/mcp/host
  # Grafana MCP (read-only). The proxy forwards the vaulted token in the X-Grafana-Api-Key
  # header (mcp-grafana wants THAT header, not Authorization: Bearer — hence auth_header);
  # the sidecar carries only GRAFANA_URL. Read-only: -disable-write on the server + the
  # proxy's readOnlyHint write-filter withholds any write tool from the assistant.
  - name: grafana
    transport: http
    url: http://grafana-mcp:8000/mcp
    auth_header: X-Grafana-Api-Key
    secret_ref: devy/mcp/grafana-cloud

# Password mode (no SSO edge in the AWS variant yet — that's readiness #5/#7). Identity
# is honor-system over the private SSM tunnel. Unverified chat callers get `operator`
# (read + host/Docker DIAGNOSTICS), NOT admin — so no elevated/mutating actions without
# a real verified identity. (The example config's default is `admin`, the footgun.)
# Auth mode. `password` = the admin plane is unlocked by the operator password
# (bootstrap + break-glass); the admin creds hydrate from the vault (ASM
# `devy/admin/password-hash` + `devy/admin/secret`) at boot via the instance role —
# no .env plumbing. Explicit here (it's also the default) to guard against a future
# default change. Interim posture for this no-public-ingress test box (reachable
# only via IAM-gated SSM port-forward). The clean cutover to a public instance is a
# single switch: `mode: jwt` structurally closes the password path (see
# docs/security.md § Killing the password backdoor).
auth:
  mode: password

rbac:
  assistant_role: operator
  default_role: viewer

# AWS grounding, injected each turn so Devy knows where it runs. The host MCP now runs
# NATIVELY (systemd) on every host, so host_* checks reflect the REAL host — no container
# caveat. host_* = this EC2 host; edge_al2023_*/edge_ubuntu_* = the remote edge hosts.
deployment_context: "Host: AWS EC2 (Amazon Linux 2023, x86_64), single-node dev/test; the Devy stack runs in Docker on this host, but the host MCP runs NATIVELY as a systemd unit — so the host_* tools reflect the REAL EC2 host (journal, systemd units, reboot history, disk), not a container. Report host_* findings as the actual host. The docker_* checks (via the socket) see the Devy stack's own containers. Remote edge hosts are reachable natively too: the edge_al2023_* tools target the Amazon Linux 2023 edge host and edge_ubuntu_* target the Ubuntu edge host — each is that host's real native sidecar, so name which host a finding is about. Host tools report LOCAL host time; Grafana, Prometheus, and Loki are UTC — state the zone on every timestamp and convert before correlating. Grafana Cloud UI base URL is ${GRAFANA_URL} — build ABSOLUTE links from it (a dashboard is <base>/d/<uid>/<slug>, an Explore link uses <base>/explore), or use the generate_deeplink tool; never emit a bare relative /d/... path."

# A broad host+docker investigation needs headroom beyond the code default of 16.
max_iterations: 28

# LangSmith waterfall tracing; key is devy/provider/langsmith in SM. capture follows
# DEVY_MODE (prod → metadata). Best-effort — a tracing failure never breaks a turn.
tracing: langsmith
langsmith:
  project: devy-aws
