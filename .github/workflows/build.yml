name: Build & push images (ECR)

# Parameterized container build for the Devy platform. Two doors in — the UI/ref-picker
# (workflow_dispatch) and the GitHub API (repository_dispatch: devy-build) — never an
# auto-build on push (the release model is coordinated, not GitOps). See docs/deploy-design.md.
#
# Builds ONE, several, or ALL components in parallel (a matrix, one runner each) and
# pushes immutable tags to their per-component ECRs. Registry-driven: the component
# list and each build's Dockerfile/context come from the ECR provenance tags
# (Project/Component/SourceRepo/Dockerfile), so a new component ECR is picked up by
# "all" with no change here.
#
# Which commit? The `matrix` job resolves ONE effective ref/SHA up front and every leg
# builds from it: the ref-picker pins to the chosen commit (github.sha); a dispatch may
# name a branch/tag (client_payload.ref) whose tip is checked out (repository_dispatch
# always runs on the default branch, so github.sha would otherwise be wrong). On a
# successful push the `record` job writes a build manifest to SSM Parameter Store (keyed
# by that SHA, with a human label and branch/component "latest" pointers) that the CD
# process lists, picks, and resumes from.

on:
  workflow_dispatch:
    inputs:
      components:
        description: "Components to build"
        # Curated presets. "all" stays registry-driven (every devy-* ECR), so a new
        # component is picked up by "all" automatically; only the convenience preset
        # below needs a line added — or use the advanced override for any combination.
        # NOTE: host-mcp is NOT built here anymore — on AWS it deploys as a native systemd
        # unit (host-mcp-deploy.yml), not an ECR image; its Dockerfile stays for the LOCAL
        # demo only. That cuts both ways with the registry-driven "all": do NOT create a
        # devy-host-mcp ECR repo (and delete it if you have one), or every "all" build keeps
        # producing an image that nothing ever deploys.
        type: choice
        default: all
        options:
          - all
          - proxy
          - chat-ui
      components_advanced:
        description: "Advanced: explicit comma-separated list (e.g. proxy,chat-ui). Overrides the dropdown when non-empty."
        type: string
        default: ""
      push:
        description: "Push to ECR + record the build (uncheck for a build-only dry run)"
        type: boolean
        default: true

  # Programmatic door — symmetric with deploy.yml / host-mcp-deploy.yml. Fire a build
  # via the GitHub API (POST /repos/…/dispatches) instead of the UI. client_payload
  # mirrors the dispatch inputs — all optional:
  #   {ref, components, components_advanced, push}
  # defaults: ref = default-branch HEAD (repository_dispatch always runs on the default
  # branch — pass a branch/tag to build its tip), components = all, push = true.
  # Whoever calls the API is authenticated by their token; WHO may call it (the
  # webhook-auth model) is decided separately — see docs/deploy-design.md §16.
  repository_dispatch:
    types: [devy-build]

permissions:
  id-token: write # OIDC -> assume the build role
  contents: read

env:
  # Account-specific values come from repo-level Actions variables so the public
  # source carries no account ID / role name. Set under Settings → Secrets and
  # variables → Actions → Variables (see docs/deploy-design.md § Required variables):
  #   AWS_REGION      (optional; defaults to us-east-1)
  #   BUILD_ROLE_ARN  arn:aws:iam::<account>:role/<your-gha-build-role>
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  BUILD_ROLE_ARN: ${{ vars.BUILD_ROLE_ARN }}
  PROJECT_PREFIX: devy

jobs:
  # ---------------------------------------------------------------------------
  # Resolve the build matrix from the registry AND compute one build identity
  # (short_sha + a single UTC stamp + a human label) shared by every image tag and
  # the manifest, so a release reads as one coherent thing.
  # ---------------------------------------------------------------------------
  matrix:
    name: Resolve build matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
      count: ${{ steps.resolve.outputs.count }}
      short_sha: ${{ steps.meta.outputs.short_sha }}
      stamp: ${{ steps.meta.outputs.stamp }}
      built_at: ${{ steps.meta.outputs.built_at }}
      branch_safe: ${{ steps.meta.outputs.branch_safe }}
      label: ${{ steps.meta.outputs.label }}
      effective_sha: ${{ steps.meta.outputs.effective_sha }}
      effective_ref: ${{ steps.meta.outputs.effective_ref }}
      push: ${{ steps.meta.outputs.push }}
    steps:
      # Resolve the build ref to one true commit. A repository_dispatch payload may name
      # a branch/tag (client_payload.ref) — but that event always runs on the default
      # branch, so github.sha is NOT the requested tip. The ref-picker path pins to the
      # exact chosen commit (github.sha). Checking out `client_payload.ref || github.sha`
      # collapses both to a single HEAD the whole release then builds from.
      - name: Checkout build ref
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.client_payload.ref || github.sha }}

      - name: Compute build identity (one stamp for the whole release)
        id: meta
        env:
          DISPATCH_REF: ${{ github.event.client_payload.ref }}
          IN_PUSH: ${{ inputs.push }}
          DP_PUSH: ${{ github.event.client_payload.push }}
        run: |
          set -euo pipefail
          # The commit actually checked out — the immutable identity for every tag/manifest.
          effective_sha="$(git rev-parse HEAD)"
          short_sha="${effective_sha:0:7}"
          # Ref name for labels + the by-branch pointer: the dispatched branch/tag, else
          # the picker's ref. Names can contain slashes (feature/foo) — sanitize for image
          # tags and SSM path segments alike.
          ref_name="${DISPATCH_REF:-${GITHUB_REF_NAME}}"
          branch_safe="$(echo "${ref_name}" | tr '/' '-' | tr -cd 'A-Za-z0-9._-')"
          branch_safe="${branch_safe:-detached}"
          # push: workflow_dispatch always sends a boolean; repository_dispatch may omit it
          # (default true — a programmatic build trigger means to publish).
          if   [ -n "${IN_PUSH}" ]; then push="${IN_PUSH}"
          elif [ -n "${DP_PUSH}" ]; then push="${DP_PUSH}"
          else push="true"; fi
          stamp="$(date -u +%Y%m%dT%H%M%SZ)"          # compact, for image tags
          built_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"   # ISO-8601, for the manifest
          label="${branch_safe}-${short_sha}-$(date -u +%Y-%m-%d-%H%M)Z"   # human-facing
          {
            echo "effective_sha=${effective_sha}"
            echo "effective_ref=${ref_name}"
            echo "short_sha=${short_sha}"
            echo "branch_safe=${branch_safe}"
            echo "push=${push}"
            echo "stamp=${stamp}"
            echo "built_at=${built_at}"
            echo "label=${label}"
          } >> "$GITHUB_OUTPUT"
          echo "Build identity: ${label}  (commit ${effective_sha}, push=${push})"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.BUILD_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve components -> matrix (registry-driven)
        id: resolve
        env:
          COMPONENTS: ${{ inputs.components || github.event.client_payload.components || 'all' }}
          COMPONENTS_ADVANCED: ${{ inputs.components_advanced || github.event.client_payload.components_advanced || '' }}
        run: |
          set -euo pipefail

          # The advanced free-text override wins when non-empty; else the dropdown preset.
          sel="$(echo "${COMPONENTS_ADVANCED}" | xargs)"   # trim
          [ -z "$sel" ] && sel="${COMPONENTS}"
          echo "Selection: ${sel}"

          # Which repos? 'all' => every ${PREFIX}-* repo; else the named components.
          if [ "${sel}" = "all" ]; then
            mapfile -t repos < <(aws ecr describe-repositories \
              --query "repositories[?starts_with(repositoryName, '${PROJECT_PREFIX}-')].repositoryName" \
              --output text | tr '\t' '\n' | sort)
          else
            repos=()
            IFS=',' read -ra parts <<< "${sel}"
            for c in "${parts[@]}"; do
              c="$(echo "$c" | xargs)"   # trim
              [ -z "$c" ] && continue
              repos+=("${PROJECT_PREFIX}-${c}")
            done
          fi

          if [ "${#repos[@]}" -eq 0 ]; then
            echo "::error::No repositories resolved from selection='${sel}'."
            exit 1
          fi

          # For each repo, read its provenance tags -> one matrix include entry.
          include='[]'
          for repo in "${repos[@]}"; do
            arn="$(aws ecr describe-repositories --repository-names "$repo" \
                   --query 'repositories[0].repositoryArn' --output text 2>/dev/null || true)"
            if [ -z "$arn" ] || [ "$arn" = "None" ]; then
              echo "::error::ECR repository '$repo' not found — add it to your ECR registry IaC (with provenance tags)."
              exit 1
            fi
            tags="$(aws ecr list-tags-for-resource --resource-arn "$arn" --output json)"
            component="$(echo "$tags"  | jq -r '(.tags[] | select(.Key=="Component")  | .Value) // ""')"
            dockerfile="$(echo "$tags" | jq -r '(.tags[] | select(.Key=="Dockerfile") | .Value) // ""')"
            if [ -z "$component" ] || [ -z "$dockerfile" ]; then
              echo "::error::Repo '$repo' is missing Component/Dockerfile provenance tags — set them on the ECR repo."
              exit 1
            fi
            context="$(dirname "$dockerfile")"
            include="$(echo "$include" | jq \
              --arg comp "$component" --arg repo "$repo" --arg df "$dockerfile" --arg ctx "$context" \
              '. += [{"component":$comp,"repository":$repo,"dockerfile":$df,"context":$ctx}]')"
          done

          count="$(echo "$include" | jq 'length')"
          {
            echo "count=${count}"
            echo "matrix={\"include\":$(echo "$include" | jq -c '.')}"
          } >> "$GITHUB_OUTPUT"

          echo "Resolved ${count} component(s):"
          echo "$include" | jq -r '.[] | "  \(.component) -> \(.repository)  (-f \(.dockerfile), ctx \(.context))"'

  # ---------------------------------------------------------------------------
  # One runner per component, in parallel. Build + push an immutable tag, then drop
  # a small manifest fragment (image + digest) as an artifact for the record job.
  # ---------------------------------------------------------------------------
  build:
    name: ${{ matrix.component }}
    needs: matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix.outputs.matrix) }}
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - name: Checkout Devy @ ${{ needs.matrix.outputs.effective_sha }}
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.matrix.outputs.effective_sha }} # pin every leg to the resolved commit

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.BUILD_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Compute image tag
        id: tag
        run: |
          set -euo pipefail
          # <component>:<branch>-<shortsha>-<utc>  (immutable, unique, shared release stamp)
          tag="${{ needs.matrix.outputs.branch_safe }}-${{ needs.matrix.outputs.short_sha }}-${{ needs.matrix.outputs.stamp }}"
          image="${{ steps.ecr.outputs.registry }}/${{ matrix.repository }}:${tag}"
          { echo "tag=${tag}"; echo "image=${image}"; } >> "$GITHUB_OUTPUT"
          echo "Image: ${image}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build & push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: ${{ needs.matrix.outputs.push }}
          tags: ${{ steps.tag.outputs.image }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
          provenance: false
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.matrix.outputs.effective_sha }}
            org.opencontainers.image.version=${{ steps.tag.outputs.tag }}

      # A successful push contributes one fragment to the release manifest. Skipped on
      # dry runs (push=false: no image exists) and on build failure (nothing to record).
      - name: Write manifest fragment
        if: ${{ success() && needs.matrix.outputs.push == 'true' }}
        run: |
          set -euo pipefail
          mkdir -p _manifest
          jq -n \
            --arg component  "${{ matrix.component }}" \
            --arg repository "${{ matrix.repository }}" \
            --arg image      "${{ steps.tag.outputs.image }}" \
            --arg tag        "${{ steps.tag.outputs.tag }}" \
            --arg digest     "${{ steps.build.outputs.digest }}" \
            '{component:$component, repository:$repository, image:$image, tag:$tag, digest:$digest}' \
            > "_manifest/${{ matrix.component }}.json"

      - name: Upload manifest fragment
        if: ${{ success() && needs.matrix.outputs.push == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: manifest-${{ matrix.component }}
          path: _manifest/${{ matrix.component }}.json
          retention-days: 7

      - name: Job summary
        if: ${{ always() }}
        run: |
          {
            echo "### ${{ matrix.component }} — ${{ job.status }}"
            echo ""
            echo "- **Pushed:** \`${{ needs.matrix.outputs.push }}\`"
            echo "- **Image:** \`${{ steps.tag.outputs.image }}\`"
            echo "- **Ref:** \`${{ needs.matrix.outputs.effective_ref }}\` · **Commit:** \`${{ needs.matrix.outputs.effective_sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # TODO(slack): post build completion to the CI/CD notifications channel once the
      # Slack bot webhook exists. Dormant until then — no SLACK_WEBHOOK_URL secret => skip.
      - name: Notify Slack (dormant until SLACK_WEBHOOK_URL is set)
        if: ${{ always() && env.SLACK_WEBHOOK_URL != '' }}
        run: |
          set -euo pipefail
          text=":package: Devy build *${{ matrix.component }}* — ${{ job.status }}
          • image: ${{ steps.tag.outputs.image }}
          • ref: ${{ needs.matrix.outputs.effective_ref }} (${{ needs.matrix.outputs.effective_sha }})
          • run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          jq -n --arg text "$text" '{text:$text}' \
            | curl -sf -X POST -H 'Content-Type: application/json' -d @- "$SLACK_WEBHOOK_URL"

  # ---------------------------------------------------------------------------
  # Record the release to SSM Parameter Store: the manifest CD lists + resumes from.
  # Runs after the builds regardless of partial failures (records whatever pushed), but
  # only for real pushes. Writes three shapes:
  #   /devy/builds/by-commit/<sha>              -> full manifest (identity = commit SHA)
  #   /devy/builds/by-branch/<branch>/latest    -> <sha>          (newest-on-branch pointer)
  #   /devy/builds/components/<component>/latest -> image+digest   (CD coherent-release fill)
  # ---------------------------------------------------------------------------
  record:
    name: Record build manifest (SSM)
    needs: [matrix, build]
    if: ${{ !cancelled() && needs.matrix.outputs.push == 'true' && needs.matrix.result == 'success' && needs.matrix.outputs.count != '0' }}
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.BUILD_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download manifest fragments
        uses: actions/download-artifact@v8
        with:
          path: _fragments
          pattern: manifest-*
          merge-multiple: true

      - name: Assemble + write SSM manifest
        env:
          SHA: ${{ needs.matrix.outputs.effective_sha }}
          SHORT_SHA: ${{ needs.matrix.outputs.short_sha }}
          BRANCH: ${{ needs.matrix.outputs.branch_safe }}
          REF_NAME: ${{ needs.matrix.outputs.effective_ref }}
          BUILT_AT: ${{ needs.matrix.outputs.built_at }}
          LABEL: ${{ needs.matrix.outputs.label }}
          REQUESTED: ${{ needs.matrix.outputs.count }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          frags=(_fragments/*.json)
          if [ "${#frags[@]}" -eq 0 ]; then
            echo "::warning::No component fragments — nothing pushed successfully, skipping manifest write."
            exit 0
          fi

          base="/devy/builds"
          commit_param="${base}/by-commit/${SHA}"

          # components{} : one entry per successfully-pushed component this run.
          components="$(jq -s 'map({(.component): {image:.image, tag:.tag, digest:.digest, repository:.repository}}) | add' "${frags[@]}")"

          # Merge with any existing record at this SHA so a partial rebuild AUGMENTS the
          # release rather than clobbering the components built by an earlier run.
          existing="$(aws ssm get-parameter --name "$commit_param" --query 'Parameter.Value' --output text 2>/dev/null || echo '')"
          prev_components='{}'
          if [ -n "$existing" ] && [ "$existing" != "None" ]; then
            prev_components="$(echo "$existing" | jq '.components // {}')"
          fi
          merged="$(jq -n --argjson a "$prev_components" --argjson b "$components" '$a * $b')"
          merged_count="$(echo "$merged" | jq 'length')"
          status="complete"; [ "$merged_count" -lt "$REQUESTED" ] && status="partial"

          manifest="$(jq -n \
            --arg sha "$SHA" --arg short_sha "$SHORT_SHA" --arg branch "$BRANCH" \
            --arg ref "$REF_NAME" --arg built_at "$BUILT_AT" --arg label "$LABEL" \
            --arg run_url "$RUN_URL" --arg actor "$ACTOR" --arg status "$status" \
            --argjson components "$merged" \
            '{schema:1, sha:$sha, short_sha:$short_sha, branch:$branch, ref:$ref,
              built_at:$built_at, label:$label, run_url:$run_url, actor:$actor,
              status:$status, components:$components}')"
          echo "$manifest" | jq .

          # 1) the release, keyed by immutable commit identity
          aws ssm put-parameter --name "$commit_param" --type String --overwrite --value "$manifest" >/dev/null
          echo "wrote $commit_param"

          # 2) mutable "newest on this branch" pointer
          aws ssm put-parameter --name "${base}/by-branch/${BRANCH}/latest" --type String --overwrite --value "$SHA" >/dev/null
          echo "wrote ${base}/by-branch/${BRANCH}/latest -> $SHA"

          # 3) per-component "latest image" pointers (CD fills unbuilt components from these)
          for c in $(echo "$components" | jq -r 'keys[]'); do
            entry="$(echo "$components" | jq -c --arg c "$c" --arg sha "$SHA" --arg branch "$BRANCH" --arg built_at "$BUILT_AT" \
              '.[$c] + {sha:$sha, branch:$branch, built_at:$built_at}')"
            aws ssm put-parameter --name "${base}/components/${c}/latest" --type String --overwrite --value "$entry" >/dev/null
            echo "wrote ${base}/components/${c}/latest"
          done

          {
            echo "### 📦 Build recorded — \`$LABEL\`"
            echo ""
            echo "- **Commit:** \`$SHA\`"
            echo "- **Branch:** \`$BRANCH\` · **Status:** \`$status\` ($merged_count/$REQUESTED components)"
            echo "- **Manifest:** \`$commit_param\`"
            echo ""
            echo "| Component | Image | Digest |"
            echo "|---|---|---|"
            echo "$merged" | jq -r 'to_entries[] | "| \(.key) | `\(.value.image)` | `\(.value.digest // "—")` |"'
          } >> "$GITHUB_STEP_SUMMARY"
