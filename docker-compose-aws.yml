# AWS deploy variant — self-contained (NOT an overlay). The CD pipeline (Devy's `deploy/`
# role) ships THIS single file + a rendered .env to the host and runs it.
#
#   docker compose -f docker-compose-aws.yml up -d proxy chat-ui postgres
#
# The host MCP is NOT a container here — it runs NATIVELY as a hardened systemd unit
# on each host (deployed by .github/workflows/host-mcp-deploy.yml), so its host_*
# checks see the REAL host, not a container namespace. The proxy reaches the
# co-located sidecar via host.docker.internal:8781 and any edge sidecars via
# ${EDGE_*_MCP_URL}. The containerized host-mcp survives only for the LOCAL demo
# (docker-compose-local.yml).
#
# Differences from docker-compose-local.yml, all baked in (no overlay-substitution
# surprises — the whole reason this is a separate file):
#   • pinned ECR images (DEVY_{PROXY,CHAT_UI}_IMAGE), never `build:`
#   • DEVY_MODE=prod + NO AWS_ENDPOINT_URL and NO static keys → boto3 hits REAL AWS
#     Secrets Manager / S3 via the host's instance IAM role
#   • NO LocalStack service (dev-only), NO demo-faulty, NO repo bind-mounts (a deploy
#     host has no source checkout — config comes from the shipped /config dir)
#   • Postgres has NO schema init mount: a fresh DB is brought to head by the gated
#     `agentic-devops db migrate` step (app-owned migrations), not a compose bind mount
# The SSO/TLS front door (oauth2-proxy) is deliberately absent here — that's readiness
# #5/#7 (post-MVP); it joins this file when the edge/ingress work lands.

services:
  proxy:
    image: ${DEVY_PROXY_IMAGE:?set DEVY_PROXY_IMAGE — the CD pipeline renders it from the release manifest}
    container_name: agentic-devops-proxy
    # Loopback-only until the TLS front door (readiness #5); reach it via SSM port-forward.
    ports:
      - "127.0.0.1:8765:8765"
    # Reach the NATIVE host-MCP sidecar (systemd unit on this EC2 host, :8781) via the
    # Docker host gateway. config.yaml's `host` mount points at host.docker.internal:8781.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://agentic:agentic@postgres:5432/agentic}
      # Real AWS: prod mode, no endpoint override, no static creds → instance IAM role.
      DEVY_MODE: prod
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      # S3 blob bucket for image attachments — name is account-specific, rendered into
      # .env by the deploy role from the BLOBS_BUCKET Actions var; config.yaml expands it.
      DEVY_BLOBS_BUCKET: ${DEVY_BLOBS_BUCKET:-}
      # Grafana tenant URL — config.yaml's deployment_context expands ${GRAFANA_URL} for
      # absolute dashboard links. Account-specific → rendered from the GRAFANA_URL var.
      GRAFANA_URL: ${GRAFANA_URL:-}
      # Native EDGE host-MCP sidecar URLs (account-specific → rendered from the
      # EDGE_*_MCP_URL Actions vars). config.yaml expands them; an unset var → an
      # unreachable mount (best-effort, never blocks startup).
      EDGE_AL2023_MCP_URL: ${EDGE_AL2023_MCP_URL:-}
      EDGE_UBUNTU_MCP_URL: ${EDGE_UBUNTU_MCP_URL:-}
    volumes:
      # Config dir shipped by the deploy role (config.yaml; no secrets on disk in prod).
      - "${AGENTIC_DEVOPS_CONFIG_DIR:-${HOME}/.config/agentic-devops}:/config"
      # Generated component docs (durable across restarts); created under the project dir.
      - "${AGENTIC_DEVOPS_DOCS_DIR:-./docs-corpus}:/app/docs-corpus"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8765/healthz').getcode()==200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # Bundled Postgres + pgvector (EBS-backed named volume). NO init bind mount — schema
  # bootstrap + evolution is app-owned (`agentic-devops db migrate`, run as the gated
  # pre-step in the deploy play). Bind a managed DB instead by setting DATABASE_URL and
  # dropping this service from the up list.
  postgres:
    image: pgvector/pgvector:pg16
    container_name: agentic-devops-postgres
    environment:
      POSTGRES_USER: agentic
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agentic}
      POSTGRES_DB: agentic
    volumes:
      - "agentic-pgdata:/var/lib/postgresql/data"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentic -d agentic"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  # NOTE: no host-mcp service here — on AWS the host MCP runs NATIVELY as a hardened
  # systemd unit (deployed by host-mcp-deploy.yml), reached at host.docker.internal:8781.
  # The containerized host-mcp lives only in docker-compose-local.yml (the local demo).

  # Static terminal-themed UI on nginx; reverse-proxies /v1 + /healthz to the proxy.
  chat-ui:
    image: ${DEVY_CHAT_UI_IMAGE:?set DEVY_CHAT_UI_IMAGE — the CD pipeline renders it from the release manifest}
    container_name: agentic-devops-chat-ui
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      proxy:
        condition: service_healthy
    restart: unless-stopped

  # Grafana MCP (read-only, mounted into the proxy's tool router). Stock upstream image,
  # pinned BY DIGEST to the known-good version the local stack runs (byte-identical). Pulled
  # from Docker Hub like the Postgres image — NOT one of our ECR-built components. The proxy
  # forwards the vaulted Grafana token (devy/mcp/grafana-cloud) in the X-Grafana-Api-Key
  # header per request; only GRAFANA_URL (non-secret tenant) sits on the sidecar. Read-only
  # doubly: -disable-write here AND allow_writes:false on the proxy mount. Compose-net only.
  grafana-mcp:
    image: mcp/grafana@sha256:9362bcf6aa0e44e61f645b905cec03fb346a946a34a4dafecd7f3e28d3724014
    container_name: agentic-devops-grafana-mcp
    environment:
      GRAFANA_URL: ${GRAFANA_URL:-}
    command:
      - "-t"
      - "streamable-http"
      - "-address"
      - "0.0.0.0:8000"
      - "-endpoint-path"
      - "/mcp"
      # The proxy dials us by the compose service name — allow that Host value.
      - "-allowed-hosts"
      - "grafana-mcp:8000"
      - "-disable-write"
    restart: unless-stopped

volumes:
  agentic-pgdata:
