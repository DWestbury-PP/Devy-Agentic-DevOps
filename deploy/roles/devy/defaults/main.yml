---
# devy — deploy the Devy platform stack to a role_platform host over SSM (deploy-design.md §18).
# This role is an EXECUTOR: given a coherent set of component image URIs (devy_images), it ships
# the compose + rendered .env + config, gates on migrations from the NEW image, recreates the
# app tier (Postgres stays up), and smokes. Resolution/selection lives in the deploy workflow
# (#19); resolve.yml is a fallback so the role is drivable by hand via -e devy_commit=<sha>.

# ── Where things land on the host (no git/source on the box — §18.3) ──
devy_target_dir: /opt/devy # project dir: compose files + rendered .env
devy_config_dir: /opt/devy/config # mounted at /config (AGENTIC_DEVOPS_CONFIG_DIR)
devy_project_name: devy

# ── Compose file for a PLATFORM deploy ──
# The single, self-contained AWS compose file (pinned images + real ASM + no LocalStack,
# all baked in — no overlay-substitution surprises). We still bring up EXPLICIT services
# (below). The SSO/TLS front door is readiness #5/#7 (post-MVP), not in this file yet.
devy_compose_files:
  - docker-compose-aws.yml

# Path on the CONTROLLER to the Devy source (compose file + config). Since CD now lives IN the
# Devy repo, this defaults to the repo root (the play sits in deploy/, so dirname(playbook_dir)).
# The workflow's checkout satisfies it automatically; a by-hand run from deploy/ needs nothing.
devy_compose_src: "{{ playbook_dir | dirname }}"

# config.yaml shipped to the host config dir — the real AWS prod config: correct 4.x Anthropic
# tiers + cross-provider fallbacks, the native host-mcp + edge mounts, operator assistant_role
# (not the example's admin footgun), and AWS deployment_context. Non-secret — provider keys
# resolve from Secrets Manager at runtime. Override per-env with -e devy_config_file=<path>.
devy_config_file: "{{ devy_compose_src }}/deploy/config/config.aws.yaml"

# ── Release inputs ──
# devy_images: {proxy: <uri>, chat-ui: <uri>} — a coherent set (one manifest). No host-mcp
# image — the host MCP is native (systemd), deployed separately by host-mcp-deploy.yml.
# Provided by the workflow, or resolved from SSM by devy_commit (resolve.yml).
devy_images: {}
devy_commit: ""
devy_region: us-east-1
devy_ssm_prefix: /devy/builds # read: by-commit/<sha> release manifests
devy_ssm_deployed_prefix: /devy/deployed # write: deployed/<env>/<host> pointer (rollback target)
devy_env_name: dev

# Extra key=values merged into the rendered project .env (image URIs + config dir are injected
# automatically). DEVY_MODE=prod and real-ASM (no AWS_ENDPOINT_URL) are baked into the AWS
# compose file, so nothing is required here by default. Add HOST_MCP_TOKEN / GRAFANA_URL / a
# managed DATABASE_URL etc. as deployment inputs when needed.
devy_env: {}

# Account-specific S3 blob bucket for image attachments — config.yaml expands
# ${DEVY_BLOBS_BUCKET}. Sourced from the DEVY_BLOBS_BUCKET env var: the deploy workflow
# sets it from the BLOBS_BUCKET Actions variable; export it for a by-hand run. Empty →
# the bucket resolves to "" and attachments are effectively off.
devy_blobs_bucket: "{{ lookup('env', 'DEVY_BLOBS_BUCKET') | default('', true) }}"

# Grafana tenant URL for the grafana-mcp sidecar + config.yaml's ${GRAFANA_URL} grounding.
# Account-specific → from the GRAFANA_URL env var (deploy workflow sets it from the
# GRAFANA_URL Actions var; export for a by-hand run). Empty → the sidecar still starts but
# has no Grafana to reach (mount will surface an auth/URL error, not crash the deploy).
devy_grafana_url: "{{ lookup('env', 'GRAFANA_URL') | default('', true) }}"

# Native EDGE host-MCP sidecar URLs — config.yaml's ${EDGE_*_MCP_URL} mounts. The edges
# run the host MCP as native systemd units (host-mcp-deploy.yml) and are reached across
# the subnet (SG allows platform→edge:8781). Account-specific → from env vars (the deploy
# workflow sets them from the EDGE_AL2023_MCP_URL / EDGE_UBUNTU_MCP_URL Actions vars).
# Empty → a best-effort "unreachable" mount that never blocks the proxy's startup.
devy_edge_al2023_url: "{{ lookup('env', 'EDGE_AL2023_MCP_URL') | default('', true) }}"
devy_edge_ubuntu_url: "{{ lookup('env', 'EDGE_UBUNTU_MCP_URL') | default('', true) }}"

# ── Service tiers ──
# App tier is recreated on deploy; the data tier (Postgres) is left running (§18.5/§18.7).
# grafana-mcp is now in the app tier (read-only Grafana MCP, config-mounted). oauth2-proxy
# (the SSO/TLS front door) is still intentionally omitted from Phase-1 — comes with #5/#7.
# host-mcp is NO LONGER a compose service on AWS — it runs natively (systemd) per host,
# deployed by host-mcp-deploy.yml. The proxy reaches the co-located sidecar via
# host.docker.internal:8781. Only the remaining containerized services recreate here.
devy_app_services: [proxy, chat-ui, grafana-mcp]
devy_data_services: [postgres]

# ── Toggles + smoke targets ──
devy_run_migrate: true
devy_run_smoke: true
devy_pg_user: agentic
devy_healthz_url: "http://127.0.0.1:8765/healthz"
