---
# Handlers are guarded against check mode: in a --check run the unit/venv aren't
# actually installed (those tasks are check-gated), so a real daemon-reload /
# restart would fail with "service not found" on a fresh host. Nothing to
# reconcile in check mode anyway.
- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true
  become: true
  when: not ansible_check_mode

- name: Reload sysctl
  ansible.builtin.command:
    cmd: sysctl --system
  become: true
  changed_when: true
  when: not ansible_check_mode

- name: Restart host-mcp
  ansible.builtin.systemd_service:
    name: agentic-devops-host-mcp.service
    state: restarted
  become: true
  when: not ansible_check_mode
