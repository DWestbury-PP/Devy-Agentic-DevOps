[defaults]
inventory            = inventory/aws_ec2.yml
roles_path           = roles
host_key_checking    = False
retry_files_enabled  = False
stdout_callback      = default
result_format        = yaml
interpreter_python   = auto_silent
# We reference facts only via ansible_facts[...] (not bare ansible_* vars), so opt out of the
# soon-to-be-removed top-level injection now — silences the INJECT_FACTS_AS_VARS deprecation.
inject_facts_as_vars = False
# Collections install here via `ansible-galaxy collection install -r requirements.yml -p collections`
collections_path     = collections

[inventory]
# The aws_ec2 dynamic-inventory plugin must be explicitly enabled.
enable_plugins = amazon.aws.aws_ec2
