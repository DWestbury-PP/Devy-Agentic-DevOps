# DEPLOY variant — run pushed ECR images instead of building locally.
#
# An OPT-IN overlay (a SECONDARY path). Local dev is unchanged: `./devy.sh` still
# builds from source. Layer this file to run the images the CI pipeline pushed to ECR:
#
#   ./devy.sh --deploy up                 # local test of the deploy variant
#   ./devy.sh --prod --deploy up          # prod backing services + ECR images
#   docker compose -f docker-compose.yml -f docker-compose.deploy.yml up -d   # raw
#
# The image URIs come from DEVY_{PROXY,HOST_MCP,CHAT_UI}_IMAGE. The CD pipeline renders
# these into the deploy host's .env from the release manifest (an SSM Parameter Store
# entry keyed by the built commit sha — see aws-ansible/docs/deploy-design.md §18). To
# test locally, set them yourself (see .env.deploy.example). Needs Docker Compose ≥ 2.24
# for the !reset / !override tags.
#
# Orthogonal to --prod/--auth: this overlay ONLY swaps build→image (and drops the
# repo-source Postgres schema mount, below). Backing-service selection (real AWS vs
# LocalStack) stays the prod overlay's job.

services:
  # The three buildable components: drop `build:` and pull the pinned ECR image.
  proxy:
    build: !reset null
    image: ${DEVY_PROXY_IMAGE:?set DEVY_PROXY_IMAGE — rendered by the CD pipeline; see .env.deploy.example}

  host-mcp:
    build: !reset null
    image: ${DEVY_HOST_MCP_IMAGE:?set DEVY_HOST_MCP_IMAGE — rendered by the CD pipeline; see .env.deploy.example}

  chat-ui:
    build: !reset null
    image: ${DEVY_CHAT_UI_IMAGE:?set DEVY_CHAT_UI_IMAGE — rendered by the CD pipeline; see .env.deploy.example}

  # A deploy host has no repo checkout, so drop the `./src/.../schema.sql` init bind
  # mount (it only exists in a source tree); keep the persistent data volume. Fresh-DB
  # schema init + evolution becomes app-owned via `agentic-devops db migrate`
  # (remote-readiness #2). Until that lands, a brand-new deploy DB must be seeded once.
  postgres:
    volumes: !override
      - "agentic-pgdata:/var/lib/postgresql/data"
